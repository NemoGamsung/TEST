# 레포 라벨의 단일 기준(source of truth)입니다.
# 이 파일이 develop에 머지되면 labels-sync 워크플로우가 레포 라벨을 이 목록과 똑같이 맞춥니다.
# ⚠️ 여기 없는 라벨은 삭제됩니다. 라벨은 GitHub 화면이 아니라 이 파일로만 관리하세요.

# ── 종류: 이슈와 PR이 같은 라벨을 씁니다. 하나의 이슈·PR에는 하나만 붙입니다. ──
#   이슈 → 이슈 폼을 고르면 자동 부착
#   PR   → 브랜치 접두사로 자동 부착 (feature/ design/ fix/ hotfix/ task/ docs/)
- name: "feature"
  color: "1D76DB"
  description: "기능 개발 (데이터 및 API 관련)"
- name: "design"
  color: "D876E3"
  description: "UI 및 스타일 작업"
- name: "bug"
  color: "D73A4A"
  description: "버그 수정"
- name: "task"
  color: "C5DEF5"
  description: "설정, CI, 리팩토링 등 기타 작업"
- name: "docs"
  color: "0075CA"
  description: "문서 작업"

# ── 영역: 이슈는 이슈 폼의 '작업 영역' 선택으로, PR은 변경 경로로 자동 부착 ──
- name: "area:web"
  color: "1f77b4"
  description: "apps/web (React)"
- name: "area:api"
  color: "2ca02c"
  description: "apps/api (Spring Boot)"
- name: "area:ai"
  color: "9467bd"
  description: "apps/ai (FastAPI)"
- name: "area:contracts"
  color: "d62728"
  description: "packages/contracts (OpenAPI 계약)"
- name: "area:infra"
  color: "8c564b"
  description: "infra/ (Firestore, Storage, GCP)"
- name: "area:ci"
  color: "7f7f7f"
  description: ".github/ (워크플로우, 레포 설정)"
- name: "area:docs"
  color: "bcbd22"
  description: "RULEBOOKS/, README"

# ── 버그 심각도: 버그 이슈 폼 '심각도' 선택으로 자동 부착 ──
- name: "severity:critical"
  color: "b60205"
  description: "서비스 불가, 데이터 손상, 개인정보 노출 위험"
- name: "severity:high"
  color: "d93f0b"
  description: "주요 기능 오동작, 우회 불가"
- name: "severity:medium"
  color: "fbca04"
  description: "우회 가능 또는 일부 화면"
- name: "severity:low"
  color: "c2e0c6"
  description: "문구, 스타일"

# ── 기타 ──
- name: "hotfix"
  color: "b60205"
  description: "hotfix/ 브랜치 (main 직행 긴급 수정, bug와 함께 자동 부착)"
- name: "release"
  color: "5319e7"
  description: "develop → main 릴리스 PR (자동 부착)"
- name: "back-merge"
  color: "5319e7"
  description: "main → develop 역머지 PR"
- name: "breaking"
  color: "000000"
  description: "하위 호환이 깨지는 계약 변경 (수동 부착)"
- name: "dependencies"
  color: "0366d6"
  description: "Dependabot 의존성 업데이트"
- name: "skip-release-notes"
  color: "ededed"
  description: "릴리스 노트에서 제외"
- name: "good first issue"
  color: "7057ff"
  description: "신규 멤버 온보딩용"
- name: "blocked"
  color: "e99695"
  description: "다른 작업·결정을 기다리는 중"
