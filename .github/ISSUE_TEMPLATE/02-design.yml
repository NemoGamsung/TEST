name: "🎨 디자인 (Design)"
description: "Figma 디자인을 화면·컴포넌트로 옮기거나 스타일을 바꿉니다. 브랜치: design/<화면ID 소문자 또는 이슈번호>-<설명> (예: design/p-hom-001-header)"
title: "[디자인] "
labels: ["design", "area:web"]
body:
  - type: markdown
    attributes:
      value: |
        **기능 동작(데이터 저장·API 호출·권한)이 바뀌면 이 템플릿이 아니라 기능(Feature)을 쓰세요.**
        디자인 이슈는 "보이는 것"만 다룹니다: 퍼블리싱, 스타일, 공통 컴포넌트 외형, 디자인 토큰, 에셋, 반응형.

  - type: input
    id: figma-link
    attributes:
      label: Figma 링크
      description: 프레임 단위 링크 (우클릭 → Copy link to selection)
      placeholder: "https://www.figma.com/design/..."
    validations:
      required: true

  - type: input
    id: screen-id
    attributes:
      label: 화면 ID
      placeholder: "P-HOM-001"
    validations:
      required: false

  - type: dropdown
    id: design-kind
    attributes:
      label: 작업 종류
      options:
        - 신규 화면 퍼블리싱
        - 기존 화면 수정
        - 공통 컴포넌트
        - 디자인 토큰 · 테마 (색, 타이포, 간격, 다크모드)
        - 에셋 (아이콘, 이미지, 폰트)
        - 반응형 · 접근성
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상 화면 · 컴포넌트
      placeholder: "예: /teams 목록 카드, 공통 Button"
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 변경 내용
      description: Figma와 현재 화면의 차이, 바꿔야 할 점
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 완료 조건
      description: 작업 범위에 해당하는 것을 체크해두면 PR에서 확인합니다.
      options:
        - label: 모바일 (360px) 확인
        - label: 태블릿 (768px) 확인
        - label: 데스크톱 (1280px 이상) 확인
        - label: 다크모드 확인
        - label: 키보드 포커스 · 대체 텍스트 확인

  - type: input
    id: related
    attributes:
      label: 연관 기능 이슈
      placeholder: "#12"
    validations:
      required: false
