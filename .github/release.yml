# GitHub Release의 "Generate release notes" 분류 규칙
# 라벨은 PR 생성 시 labeler가 브랜치 접두사로 자동으로 붙인 종류 라벨을 사용합니다.
changelog:
  exclude:
    labels:
      - skip-release-notes
      - release
      - back-merge
  categories:
    - title: "⚠️ 호환성 변경"
      labels: ["breaking"]
    - title: "✨ 기능"
      labels: ["feature"]
    - title: "🎨 디자인"
      labels: ["design"]
    - title: "🐞 버그 수정"
      labels: ["bug"]
    - title: "🔧 작업"
      labels: ["task"]
    - title: "📝 문서"
      labels: ["docs"]
    - title: "📦 의존성"
      labels: ["dependencies"]
    - title: "기타"
      labels: ["*"]
